<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskify - Susun Tugas, Tuntaskan Target</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--tx:#1f1e1d;--mu:#6b6a68;--ln:#e6e4dc;--ac:#4f46e5;--ac2:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--sh:0 1px 3px rgba(0,0,0,.08)}
:root[data-theme=dark]{--bg:#16161a;--card:#202026;--tx:#f1f0ee;--mu:#a09fa8;--ln:#34343c;--ac:#818cf8;--ac2:#2a2b45;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--sh:none}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:700;font-size:20px;color:var(--ac)}
.hi{color:var(--mu);font-size:14px}
h1{font-size:22px;margin-bottom:12px}
h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.chip.high{background:#fee2e2;color:#b91c1c}.chip.mid{background:#fef3c7;color:#92400e}.chip.low{background:#dcfce7;color:#166534}
.chip.bad{background:#fee2e2;color:#b91c1c}.chip.warn{background:#fef3c7;color:#92400e}
:root[data-theme=dark] .chip.high,:root[data-theme=dark] .chip.bad{background:#4a1d1d;color:#fca5a5}
:root[data-theme=dark] .chip.mid,:root[data-theme=dark] .chip.warn{background:#4a3410;color:#fcd34d}
:root[data-theme=dark] .chip.low{background:#16361f;color:#86efac}
.btn{background:var(--ac);color:#fff;padding:11px 16px;border-radius:11px;font-weight:600;width:100%}
.btn.sm{width:auto;padding:7px 12px;font-size:13px}
.btn.ghost{background:var(--ac2);color:var(--ac)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.nav button:focus-visible,.chk:focus-visible,.sw:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.task{display:flex;gap:10px;align-items:flex-start}
.task .t{flex:1;min-width:0}
.task .t b{display:block;word-break:break-word}
.task.done .t b{text-decoration:line-through;color:var(--mu)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center;font-size:13px;color:var(--mu)}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sub{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.sub .chk{width:20px;height:20px;font-size:12px}
.sub.done span{text-decoration:line-through;color:var(--mu)}
label.f{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input[type=text],input[type=datetime-local],input[type=email],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--ln);background:var(--card);font-size:14px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:22px 0}
.banner{background:var(--ac2);color:var(--ac);border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:14px}
.sw{width:46px;height:27px;border-radius:99px;background:var(--ln);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:22px}
.set{padding:12px 0;border-bottom:1px solid var(--ln)}.set:last-child{border:0}
.set small{display:block;color:var(--mu);font-size:13px}
.week{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:8px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{max-width:640px;margin:0 auto;display:flex}
.nav button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px;line-height:1}
.nav button.on{color:var(--ac);font-weight:600}
.nav .plus span{background:var(--ac);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:26px;margin-top:-18px;box-shadow:0 2px 8px rgba(79,70,229,.45)}
.hero{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.hero{overflow-y:auto}
.hero>div{max-width:380px;width:100%;margin:auto}
.hero .logo{font-size:30px;font-weight:700;color:var(--ac);margin-bottom:4px}
.hero h2{font-size:22px;margin:6px 0 4px}
.hero form{text-align:left}
.hero label.f{margin-top:10px}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ac);font-weight:600;padding:6px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:8px 0 2px;text-align:left}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.lnk{color:var(--ac);font-weight:600;padding:4px}
.hero input[type=email],.hero input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
.hero input[type=text]{background:var(--card)}
.hero h1{font-size:40px;color:var(--ac);margin:8px 0}
.hero p{color:var(--mu);margin-bottom:22px}
.hero .btn{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1f1e1d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="hero" class="hero" hidden></div>
<div class="wrap">
  <header><div><div class="brand">Taskify</div><div class="hi" id="hi"></div></div><button class="btn ghost sm" data-a="theme" aria-label="Ganti mode gelap">🌓</button></header>
  <main id="app"></main>
</div>
<nav class="nav"><div>
  <button data-a="go" data-p="home"><span>⌂</span>Beranda</button>
  <button data-a="go" data-p="board"><span>▦</span>Papan</button>
  <button class="plus" data-a="go" data-p="add" aria-label="Tambah tugas"><span>+</span></button>
  <button data-a="go" data-p="report"><span>◔</span>Laporan</button>
  <button data-a="go" data-p="set"><span>⚙</span>Pengaturan</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const KEY='taskify.v1',MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const ST=[['todo','To Do'],['prog','In Progress'],['done','Done']],PR={high:'Tinggi',mid:'Sedang',low:'Rendah'};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0'),loc=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
const rel=(n,h=0,m=0)=>{const x=new Date();x.setDate(x.getDate()+n);x.setHours(h,m,0,0);return x.toISOString()};
let id=100;const nid=()=>'t'+Date.now()+(id++);
function seed(){const T=(i,title,cat,pri,due,status,subs,notes,dn)=>({id:i,title,cat,pri,due,status,subs:subs||[],notes:notes||'',doneAt:dn||null});
return{onb:false,name:'Rian',dark:matchMedia('(prefers-color-scheme: dark)').matches,notif:true,gcal:false,cats:['Kuliah','Freelance','Pribadi'],tasks:[
T('s1','Submisi Makalah IMK','Kuliah','high',rel(1,23,59),'prog',[{t:'Bab 1 & 2',d:true},{t:'Bab 3 & Kesimpulan',d:false}],'Format PDF, maks 5 MB'),
T('s2','Revisi Desain Logo','Freelance','mid',rel(1,17,0),'todo',[],'Revisi sesuai catatan klien'),
T('s3','Laporan Praktikum C++','Kuliah','mid',rel(4,20,0),'todo'),
T('s4','Olahraga Sore','Pribadi','low',rel(0,18,0),'todo'),
T('s5','Tugas Basis Data','Kuliah','high',rel(-5,23,0),'done',0,0,rel(-5,20)),
T('s6','Kuis Pemrograman Web','Kuliah','mid',rel(-4,10,0),'done',0,0,rel(-4,9)),
T('s7','Desain Banner Klien','Freelance','high',rel(-3,12,0),'done',0,0,rel(-3,11)),
T('s8','Presentasi Jaringan Komputer','Kuliah','mid',rel(-2,9,0),'done',0,0,rel(-2,8)),
T('s9','Bayar Kos','Pribadi','low',rel(-1,12,0),'done',0,0,rel(-1,10)),
T('s10','Revisi Poster Event','Freelance','mid',rel(-1,15,0),'done',0,0,rel(-1,14)),
T('s11','Resume Materi Algoritma','Kuliah','low',rel(0,8,0),'done',0,0,rel(0,7))]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!Array.isArray(S.tasks))S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let page='home',tab='prog',draft=null,flt={q:'',pri:'all',cat:'all'};
const newDraft=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(23,59,0,0);return{title:'',cat:S.cats[0]||'Pribadi',pri:'mid',due:loc(d),notes:'',subs:[]}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function dl(t){const d=new Date(t.due),n=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()),df=Math.round((a-b)/864e5),hm=p2(d.getHours())+':'+p2(d.getMinutes());
if(t.status!=='done'&&d<n)return['Terlambat · '+d.getDate()+' '+MON[d.getMonth()],'bad'];if(df===0)return['Hari ini, '+hm,'warn'];if(df===1)return['Besok, '+hm,''];return[d.getDate()+' '+MON[d.getMonth()]+', '+hm,'']}
const chips=t=>{const[l,c]=dl(t);return`<span class="chip ${t.pri}">${PR[t.pri]}</span><span class="chip">${esc(t.cat)}</span><span class="${c?'chip '+c:''}">${l}</span>`};
const byDue=(a,b)=>new Date(a.due)-new Date(b.due),act=()=>S.tasks.filter(t=>t.status!=='done').sort(byDue),dn=()=>S.tasks.filter(t=>t.status==='done');
const pct=()=>S.tasks.length?Math.round(dn().length/S.tasks.length*100):0;
function row(t){const s=t.subs.length?` · ${t.subs.filter(x=>x.d).length}/${t.subs.length} sub-tugas`:'';return`<div class="card task ${t.status==='done'?'done':''}"><button class="chk ${t.status==='done'?'on':''}" data-a="tog" data-i="${t.id}" aria-label="Tandai selesai">${t.status==='done'?'✓':''}</button><div class="t"><b>${esc(t.title)}</b><div class="meta">${chips(t)}${s}</div></div></div>`}
function home(){const a=act(),urgent=a.filter(t=>t.pri==='high'||new Date(t.due)<new Date()),nx=a.find(t=>new Date(t.due)>new Date()),h=nx?(new Date(nx.due)-new Date())/36e5:99;
let ban='';if(S.notif&&nx&&h<=48){ban=`<div class="banner">🔔 Tugas '${esc(nx.title)}' akan jatuh tempo dalam ${h<1?Math.max(1,Math.round(h*60))+' menit':h<24?Math.round(h)+' jam':Math.round(h/24)+' hari'} lagi!</div>`}
return`<h1>Ringkasan Hari Ini</h1>${ban}
<div class="grid2"><div class="card stat"><b>${a.length}</b><span>Tugas Aktif</span></div><div class="card stat"><b>${dn().length}</b><span>Tugas Selesai</span></div></div>
<div class="card"><div class="row sp"><b>Progres Minggu Ini</b><b>${pct()}%</b></div><div class="bar" style="margin-top:8px"><i style="width:${pct()}%"></i></div></div>
<div class="card"><b>Tambah cepat</b><div class="row" style="margin-top:8px"><input type="text" id="qa" placeholder="Ketik judul tugas lalu tekan Enter" maxlength="80"><button class="btn sm" data-a="qa">Tambah</button></div></div>
<h2>Tugas Mendesak</h2>${urgent.length?urgent.slice(0,4).map(row).join(''):'<div class="empty">Tidak ada tugas mendesak 🎉</div>'}
<h2>Tugas Mendatang</h2>${a.length?a.slice(0,6).map(row).join(''):'<div class="empty">Semua tugas selesai!</div>'}
<button class="btn" data-a="go" data-p="add">+ Tambah Tugas Baru</button>`}
function add(){const d=draft;return`<h1>Tambah Tugas Baru</h1><div class="card">
<label class="f" for="f-title">Judul</label><input type="text" id="f-title" data-f="title" value="${esc(d.title)}" placeholder="mis. Submisi Makalah IMK" maxlength="80">
<label class="f" for="f-cat">Kategori / Proyek</label><select id="f-cat" data-f="cat">${S.cats.map(c=>`<option ${c===d.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
<label class="f">Prioritas</label><div class="seg">${Object.keys(PR).map(k=>`<button data-a="pri" data-v="${k}" class="${d.pri===k?'on':''}">${PR[k]}</button>`).join('')}</div>
<label class="f" for="f-due">Deadline</label><input type="datetime-local" id="f-due" data-f="due" value="${d.due}">
<label class="f" for="f-notes">Catatan</label><textarea id="f-notes" data-f="notes" placeholder="mis. Format PDF, maks 5 MB">${esc(d.notes)}</textarea>
<label class="f">Sub-tugas</label>${d.subs.map((s,i)=>`<div class="sub"><button class="chk ${s.d?'on':''}" data-a="dsub" data-i="${i}" aria-label="Centang">${s.d?'✓':''}</button><span style="flex:1">${esc(s.t)}</span><button class="btn danger sm" data-a="rsub" data-i="${i}" aria-label="Hapus sub-tugas">✕</button></div>`).join('')}
<div class="row" style="margin-top:6px"><input type="text" id="ns" placeholder="Tambah sub-tugas" maxlength="60"><button class="btn ghost sm" data-a="asub">Tambah</button></div></div>
<button class="btn" data-a="save">Simpan Tugas</button>`}
function card(t){const i=ST.findIndex(s=>s[0]===t.status),open=t.subs.length;
return`<div class="card"><b>${esc(t.title)}</b><div class="meta">${chips(t)}</div>${t.notes?`<div class="meta">${esc(t.notes)}</div>`:''}
${open?t.subs.map((s,k)=>`<div class="sub ${s.d?'done':''}"><button class="chk ${s.d?'on':''}" data-a="sub" data-i="${t.id}" data-k="${k}" aria-label="Centang sub-tugas">${s.d?'✓':''}</button><span>${esc(s.t)}</span></div>`).join(''):''}
<div class="act">${i>0?`<button class="btn ghost sm" data-a="mv" data-i="${t.id}" data-d="-1">← ${ST[i-1][1]}</button>`:''}${i<2?`<button class="btn sm" data-a="mv" data-i="${t.id}" data-d="1">${ST[i+1][1]} →</button>`:''}<button class="btn danger sm" data-a="del" data-i="${t.id}">Hapus</button></div></div>`}
function board(){const q=flt.q.toLowerCase(),L=S.tasks.filter(t=>t.status===tab&&(flt.pri==='all'||t.pri===flt.pri)&&(flt.cat==='all'||t.cat===flt.cat)&&(!q||t.title.toLowerCase().includes(q))).sort(byDue);
return`<h1>Papan Proyek</h1><div class="seg" style="margin-bottom:12px">${ST.map(s=>`<button data-a="tab" data-v="${s[0]}" class="${tab===s[0]?'on':''}">${s[1]} (${S.tasks.filter(t=>t.status===s[0]).length})</button>`).join('')}</div>
<div class="card"><input type="text" id="q" placeholder="Cari tugas…" value="${esc(flt.q)}"><div class="grid2" style="margin-top:8px"><select data-fl="pri"><option value="all">Semua prioritas</option>${Object.keys(PR).map(k=>`<option value="${k}" ${flt.pri===k?'selected':''}>${PR[k]}</option>`).join('')}</select><select data-fl="cat"><option value="all">Semua kategori</option>${S.cats.map(c=>`<option ${flt.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
${L.length?L.map(card).join(''):'<div class="empty">Belum ada tugas di kolom ini.</div>'}<button class="btn" data-a="go" data-p="add">+ Tambah Tugas Baru</button>`}
function report(){const D=dn(),cats={};D.forEach(t=>cats[t.cat]=(cats[t.cat]||0)+1);const sc=pct(),lb=sc>=80?'Sangat Bagus':sc>=60?'Bagus':sc>=40?'Cukup':'Perlu ditingkatkan';
const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return{l:DAY[d.getDay()],n:D.filter(t=>t.doneAt&&new Date(t.doneAt).toDateString()===d.toDateString()).length}}),mx=Math.max(1,...days.map(d=>d.n));
return`<h1>Laporan Produktivitas</h1><div class="card"><div class="stat"><b>${D.length}</b><span>Tugas selesai</span></div></div>
<div class="card"><b>Penyelesaian per Kategori</b>${Object.keys(cats).map(c=>{const p=Math.round(cats[c]/D.length*100);return`<div style="margin-top:10px"><div class="row sp"><span>${esc(c)}</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')||'<div class="empty">Belum ada data.</div>'}</div>
<div class="card"><b>Tren 7 Hari</b><div class="week">${days.map(d=>`<div><i style="height:${d.n/mx*70}%"></i>${d.l}</div>`).join('')}</div></div>
<div class="card"><div class="row sp"><b>Skor Produktivitas</b><b>${sc}/100</b></div><div class="bar" style="margin:8px 0"><i style="width:${sc}%"></i></div><span class="chip">${lb}</span><div class="meta">Dihitung dari persentase tugas yang sudah selesai.</div></div>
<button class="btn" data-a="csv">Ekspor Riwayat Tugas (CSV)</button>`}
function sw(k,on,t,s){return`<div class="set row sp"><div><b>${t}</b><small>${s}</small></div><button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" data-a="${k}" aria-label="${t}"></button></div>`}
function settings(){return`<h1>Pengaturan</h1><div class="card"><div class="row sp"><div><b>Akun</b><small style="display:block;color:var(--mu);font-size:13px">${S.auth==='user'?'Masuk sebagai '+esc(S.email):'Mode offline (data hanya di perangkat ini)'}</small></div><button class="btn ${S.auth==='user'?'danger':''} sm" data-a="logout">${S.auth==='user'?'Keluar':'Masuk / Daftar'}</button></div></div><div class="card">
${sw('notif',S.notif,'Pengingat & Notifikasi','Pengingat deadline dan tugas terlewat')}${sw('theme',S.dark,'Mode Gelap','Tampilan gelap untuk mata')}${sw('gcal',S.gcal,'Google Calendar',S.gcal?'Terhubung (simulasi)':'Hubungkan untuk sinkron jadwal')}
<div class="set"><b>Nama Pengguna</b><input type="text" id="nm" value="${esc(S.name)}" maxlength="30" style="margin-top:6px"></div></div>
<div class="card"><b>Kategori & Label Kustom</b><div class="meta" style="margin:8px 0">${S.cats.map((c,i)=>`<span class="chip">${esc(c)} <button data-a="dcat" data-i="${i}" aria-label="Hapus kategori ${esc(c)}">✕</button></span>`).join('')}</div>
<div class="row"><input type="text" id="nc" placeholder="Kategori baru" maxlength="20"><button class="btn ghost sm" data-a="acat">Tambah</button></div></div>
<div class="card"><b>Backup & Pemulihan Data</b><div class="act"><button class="btn sm" data-a="bak">Backup (JSON)</button><button class="btn ghost sm" data-a="rst">Pulihkan</button><button class="btn danger sm" data-a="reset">Reset Data</button></div></div>`}
function dl2(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function render(){document.documentElement.dataset.theme=S.dark?'dark':'light';$('#hi').textContent='Halo, '+S.name;
if(page==='add'&&!draft)draft=newDraft();
$('#app').innerHTML={home,add,board,report,set:settings}[page]();
document.querySelectorAll('.nav button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
hero()}
function go(p){page=p;if(p==='add')draft=newDraft();scrollTo(0,0);render()}
function addTask(o){S.tasks.push({id:nid(),title:o.title,cat:o.cat,pri:o.pri,due:new Date(o.due).toISOString(),status:'todo',subs:o.subs||[],notes:o.notes||'',doneAt:null});save()}

let view=null;const UK='taskify.users';
const users=()=>{try{return JSON.parse(localStorage.getItem(UK))||{}}catch(e){return{}}};
const putUsers=u=>{try{localStorage.setItem(UK,JSON.stringify(u))}catch(e){}};
async function hash(pw,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+pw)h=(h*33)^c.charCodeAt(0);return'x'+(h>>>0).toString(16)}}
const showErr=m=>{const e=$('#err');if(e)e.textContent=m};
const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function loggedIn(email,name,msg){S.auth='user';S.email=email;S.name=name;S.onb=true;save();view=null;page='home';render();toast(msg||'Selamat datang, '+name+'!')}
async function authGo(){
 const em=($('#ae')||{value:''}).value.trim().toLowerCase(),pw=($('#ap')||{value:''}).value,nm=($('#an')||{value:''}).value.trim(),cf=($('#ac')||{value:''}).value;
 if(!okMail(em))return showErr('Masukkan alamat email yang valid.');
 const U=users();
 if(view==='google'){const n=em.split('@')[0].replace(/[._-]+/g,' ');const name=(U[em]&&U[em].name)||n.replace(/\b\w/g,c=>c.toUpperCase());return loggedIn(em,name,'Masuk dengan Google (simulasi) berhasil')}
 if(!pw)return showErr('Kata sandi wajib diisi.');
 if(view==='register'){
  if(!nm)return showErr('Nama lengkap wajib diisi.');
  if(pw.length<6)return showErr('Kata sandi minimal 6 karakter.');
  if(pw!==cf)return showErr('Konfirmasi kata sandi tidak cocok.');
  if(U[em])return showErr('Email sudah terdaftar. Silakan masuk.');
  const salt=Math.random().toString(36).slice(2);U[em]={name:nm,salt,h:await hash(pw,salt)};putUsers(U);
  return loggedIn(em,nm,'Akun berhasil dibuat. Selamat datang, '+nm+'!')}
 const u=U[em];
 if(!u||u.h!==await hash(pw,u.salt))return showErr('Email atau kata sandi salah.');
 loggedIn(em,u.name)}
function hero(){const h=$('#hero');if(S.auth){h.hidden=true;h.innerHTML='';return}
 h.hidden=false;if(!view)view=S.onb?'login':'intro';
 const eye='<button type="button" data-a="eye" aria-label="Tampilkan atau sembunyikan kata sandi">Lihat</button>';
 if(view==='intro'){h.innerHTML=`<div><div style="font-size:54px">✅</div><h1>Taskify</h1><p>Susun Tugas, Tuntaskan Target<br>Buat papan tugas pertamamu</p><button class="btn" data-a="begin">Mulai Sekarang</button></div>`;return}
 const reg=view==='register',goo=view==='google';
 h.innerHTML=`<div><div class="logo">✅ Taskify</div><h2>${goo?'Masuk dengan Google':reg?'Buat akun baru':'Selamat datang kembali'}</h2><p style="margin-bottom:14px">${goo?'Simulasi: masukkan email Google Anda.':reg?'Daftar untuk sinkronisasi antar-perangkat.':'Masuk untuk melanjutkan tugas Anda.'}</p>
 ${goo?'':'<button class="btn ghost" data-a="google" type="button">G&nbsp; Masuk dengan Google</button><div class="or">atau dengan email</div>'}
 <form id="af" novalidate>
 ${reg?'<label class="f" for="an">Nama lengkap</label><input type="text" id="an" autocomplete="name" maxlength="40">':''}
 <label class="f" for="ae">Email</label><input type="email" id="ae" autocomplete="email" placeholder="nama@email.com">
 ${goo?'':`<label class="f" for="ap">Kata sandi</label><div class="pw"><input type="password" id="ap" autocomplete="${reg?'new-password':'current-password'}">${eye}</div>`}
 ${reg?'<label class="f" for="ac">Ulangi kata sandi</label><input type="password" id="ac" autocomplete="new-password">':''}
 <div class="err" id="err" role="alert"></div>
 <button class="btn" type="submit">${goo?'Lanjutkan':reg?'Daftar':'Masuk'}</button></form>
 <p style="margin:14px 0 0">${goo?'<button class="lnk" data-a="vw" data-v="login">← Kembali</button>':reg?'Sudah punya akun? <button class="lnk" data-a="vw" data-v="login">Masuk</button>':'Belum punya akun? <button class="lnk" data-a="vw" data-v="register">Daftar</button>'}</p>
 <div class="or">atau</div><button class="btn ghost" data-a="guest" type="button">Lewati Login (mode offline)</button></div>`;
 const f=$('#ae');if(f&&!matchMedia('(pointer:coarse)').matches)f.focus()}
document.addEventListener('submit',e=>{if(e.target.id==='af'){e.preventDefault();authGo()}});
const A={
go:e=>go(e.dataset.p),begin:()=>{S.onb=true;save();view='login';render()},
guest:()=>{S.auth='guest';S.onb=true;save();view=null;render();toast('Mode offline: data tersimpan di perangkat ini')},
google:()=>{view='google';render()},
vw:e=>{view=e.dataset.v;render()},
eye:()=>{['#ap','#ac'].forEach(q=>{const i=$(q);if(i)i.type=i.type==='password'?'text':'password'})},
auth:authGo,
logout:()=>{if(S.auth==='user'&&!confirm('Keluar dari akun?'))return;S.auth=null;save();view='login';page='home';render()},
theme:()=>{S.dark=!S.dark;save();render()},
tog:e=>{const t=S.tasks.find(x=>x.id===e.dataset.i);t.status=t.status==='done'?'todo':'done';t.doneAt=t.status==='done'?new Date().toISOString():null;if(t.status==='done')t.subs.forEach(s=>s.d=true);save();render();toast(t.status==='done'?'Tugas selesai 🎉':'Tugas dikembalikan')},
qa:()=>{const i=$('#qa'),v=i.value.trim();if(!v)return toast('Tulis judul tugas dulu');const d=new Date();d.setDate(d.getDate()+1);d.setHours(23,59,0,0);addTask({title:v,cat:S.cats[0]||'Pribadi',pri:'mid',due:d});render();toast('Tugas ditambahkan')},
pri:e=>{draft.pri=e.dataset.v;render()},
asub:()=>{const i=$('#ns'),v=i.value.trim();if(!v)return;draft.subs.push({t:v,d:false});render();$('#ns').focus()},
rsub:e=>{draft.subs.splice(+e.dataset.i,1);render()},dsub:e=>{const s=draft.subs[+e.dataset.i];s.d=!s.d;render()},
save:()=>{if(!draft.title.trim())return toast('Judul wajib diisi');if(!draft.due)return toast('Deadline wajib diisi');addTask({...draft,title:draft.title.trim()});tab='todo';draft=null;toast('Tugas disimpan');go('board')},
tab:e=>{tab=e.dataset.v;render()},
mv:e=>{const t=S.tasks.find(x=>x.id===e.dataset.i),k=ST.findIndex(s=>s[0]===t.status)+ +e.dataset.d;t.status=ST[k][0];t.doneAt=t.status==='done'?new Date().toISOString():null;save();tab=t.status;render();toast('Dipindah ke '+ST[k][1])},
sub:e=>{const t=S.tasks.find(x=>x.id===e.dataset.i),s=t.subs[+e.dataset.k];s.d=!s.d;save();render()},
del:e=>{if(!confirm('Hapus tugas ini?'))return;S.tasks=S.tasks.filter(x=>x.id!==e.dataset.i);save();render();toast('Tugas dihapus')},
csv:()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',r=[['Judul','Kategori','Prioritas','Deadline','Status','Sub-tugas selesai'].map(q).join(',')];S.tasks.forEach(t=>r.push([t.title,t.cat,PR[t.pri],new Date(t.due).toLocaleString('id-ID'),ST.find(s=>s[0]===t.status)[1],t.subs.filter(x=>x.d).length+'/'+t.subs.length].map(q).join(',')));dl2('taskify-riwayat.csv','\ufeff'+r.join('\n'),'text/csv');toast('CSV diunduh')},
notif:()=>{S.notif=!S.notif;save();render();if(S.notif&&'Notification'in window&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}toast(S.notif?'Notifikasi aktif':'Notifikasi nonaktif')},
gcal:()=>{S.gcal=!S.gcal;save();render();toast(S.gcal?'Google Calendar terhubung (simulasi)':'Google Calendar diputus')},
acat:()=>{const v=$('#nc').value.trim();if(!v)return;if(S.cats.includes(v))return toast('Kategori sudah ada');S.cats.push(v);save();render();toast('Kategori ditambahkan')},
dcat:e=>{if(S.cats.length<2)return toast('Minimal satu kategori');S.cats.splice(+e.dataset.i,1);save();render()},
bak:()=>{dl2('taskify-backup.json',JSON.stringify(S,null,2),'application/json');toast('Backup diunduh')},
rst:()=>$('#file').click(),
reset:()=>{if(!confirm('Hapus semua data dan kembali ke data contoh?'))return;const a=S.auth,m=S.email;S=seed();S.onb=true;S.auth=a;S.email=m;save();render();toast('Data direset')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&draft)draft[t.dataset.f]=t.value;if(t.id==='q'){flt.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}if(t.id==='nm'){S.name=t.value.trim()||'Rian';save();$('#hi').textContent='Halo, '+S.name}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.fl){flt[t.dataset.fl]=t.value;render()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='qa')A.qa();if(id==='ns'){e.preventDefault();A.asub()}if(id==='nc')A.acat()});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.cats))throw 0;const a=S.auth,m=S.email;S=d;S.onb=true;S.auth=a;S.email=m;save();render();toast('Data berhasil dipulihkan')}catch(x){toast('File backup tidak valid')}};r.readAsText(f);e.target.value=''});
render();
</script>
</body>
</html>
